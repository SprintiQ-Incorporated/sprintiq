<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <title>Model Context Protocol</title>
  <g fill="none" stroke="#10B981" stroke-width="1.5">
    <!-- Central node -->
    <circle cx="12" cy="12" r="2" fill="#10B981"/>
    
    <!-- Connected nodes -->
    <circle cx="6" cy="6" r="1.5" fill="#10B981"/>
    <circle cx="18" cy="6" r="1.5" fill="#10B981"/>
    <circle cx="6" cy="18" r="1.5" fill="#10B981"/>
    <circle cx="18" cy="18" r="1.5" fill="#10B981"/>
    
    <!-- Connection lines -->
    <line x1="12" y1="12" x2="6" y2="6"/>
    <line x1="12" y1="12" x2="18" y2="6"/>
    <line x1="12" y1="12" x2="6" y2="18"/>
    <line x1="12" y1="12" x2="18" y2="18"/>
    
    <!-- Outer ring -->
    <circle cx="12" cy="12" r="9" stroke-dasharray="2 2" opacity="0.5"/>
  </g>
</svg>
